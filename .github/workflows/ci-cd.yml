name: CI CD Tarefas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Validar e testar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v6
      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verificar sintaxe
        run: npm run check
      - name: Executar testes
        run: npm test
      - name: Gerar arquivos da aplicação
        run: npm run build
      - name: Armazenar site para deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publicar no GitHub Pages
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar aplicação
        id: deployment
        uses: actions/deploy-pages@v4
